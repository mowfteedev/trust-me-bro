openapi: 3.0.3
info:
  title: ZT-ServerOps Control Plane API
  version: 1.1.0
  description: |
    API của mô hình đồ án. Node được đăng ký bằng CLI setup-demo, không có HTTP CRUD node.
    ADMIN mở SSH; VIEWER chỉ đọc giám sát. Giá trị DB HEALTHY/WARNING/OFFLINE
    được giao diện hiển thị Online/Stale/Offline; cảnh báo CPU là incident riêng.
servers:
  - url: https://localhost
    description: Demo cục bộ, CA nội bộ Caddy
paths:
  /api/auth/login:
    post:
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: JWT HS256 và thông tin người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  token: {type: string}
                  user: {$ref: '#/components/schemas/User'}
        '401': {description: Sai thông tin đăng nhập}
        '403': {description: Tài khoản bị khóa}
        '429': {description: Vượt 10 lần đăng nhập mỗi phút trên một IP}
        '503': {description: Không lưu được audit}
  /api/auth/me:
    get:
      summary: Thông tin phiên, vai trò và session_version từ DB
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Người dùng hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  user: {$ref: '#/components/schemas/User'}
        '401': {description: JWT hết hạn hoặc đã bị thu hồi}
        '503': {description: Không xác thực được trạng thái DB}
  /api/auth/logout:
    post:
      summary: Tăng session_version, thu hồi các phiên của tài khoản
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Đã thu hồi phiên và ghi audit}
        '401': {description: Phiên không hợp lệ}
        '503': {description: Lỗi kết nối hoặc audit; client không nhận là xác nhận server}
  /api/nodes:
    get:
      summary: Danh sách node và bộ đo mới nhất
      description: Alias của GET /api/telemetry/nodes, cùng xác thực.
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Danh sách trong data (không phải array ở root)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/NodeItem'}
        '401': {description: Chưa xác thực}
  /api/telemetry/nodes:
    get:
      summary: Danh sách node, endpoint Dashboard đang dùng
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Object success/data như GET /api/nodes
        '401': {description: Chưa xác thực}
  /api/nodes/{node_id}/history:
    get:
      summary: Tối đa 100 bộ đo mới nhất, thứ tự thời gian giảm dần
      description: Alias của GET /api/telemetry/nodes/{node_id}/history.
      security: [{BearerAuth: []}]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Object success/node_id/count/data; node không có dữ liệu trả mảng rỗng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  node_id: {type: string}
                  count: {type: integer}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/MetricSnapshot'}
        '401': {description: Chưa xác thực}
  /api/telemetry/nodes/{node_id}/history:
    get:
      summary: Lịch sử node, endpoint Dashboard đang dùng
      security: [{BearerAuth: []}]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: 'Cùng object trả về như /api/nodes/{node_id}/history'}
        '401': {description: Chưa xác thực}
  /api/telemetry/beacon:
    post:
      summary: Nhận telemetry từ Mini-Agent qua WireGuard mỗi 3 giây
      description: |
        Alias POST /api/telemetry cũng được hỗ trợ. Token gắn đúng node_id.
        Nhận payload lồng metrics; định dạng phẳng được chuẩn hóa để tương thích.
        Schema dưới mô tả payload Agent. Dữ liệu liveness dùng giờ nhận trên Gateway.
      security: [{NodeTokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryBeacon'}
      responses:
        '200':
          description: Đã lưu metric và cập nhật heartbeat trong transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  node_id: {type: string}
                  status: {type: string, enum: [HEALTHY]}
                  recorded_at: {type: string, format: date-time}
        '400': {description: INVALID_TELEMETRY_PAYLOAD}
        '401': {description: MISSING_NODE_TOKEN / INVALID_NODE_TOKEN / REVOKED_NODE_TOKEN}
        '403': {description: IDOR_MISMATCH}
        '500': {description: Lỗi DB, transaction được rollback}
  /api/bastion/ticket:
    post:
      summary: Cấp vé SSH dùng một lần, chỉ ADMIN
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id: {type: string}
      responses:
        '200':
          description: Vé tối đa 30 giây và không vượt hạn JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  ticket: {type: string}
                  expires_in_seconds: {type: integer, maximum: 30}
        '401': {description: JWT không hợp lệ}
        '403': {description: VIEWER bị từ chối}
        '503': {description: Không ghi được audit}
  /ws/terminal/{node_id}:
    get:
      summary: WebSocket tới SSH/PTY
      description: |
        Không đặt JWT trong URL. Sau HTTP Upgrade, gửi frame JSON đầu tiên
        {"type":"AUTH","ticket":"vé từ /api/bastion/ticket"} trong 5 giây.
        Server trả READY hoặc ERROR; dữ liệu terminal là text stream hai chiều.
        Resize gửi {"type":"RESIZE","rows":32,"cols":100}.
        Vé được tiêu thụ một lần. Gateway kiểm tra lại ADMIN/session_version,
        khóa SSH và fingerprint; logout/khóa tài khoản thu hồi phiên đang mở.
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '101': {description: Upgrade; xác thực ứng dụng tiếp tục bằng AUTH frame}
  /api/audit/logs:
    get:
      summary: Nhật ký hoạt động chỉ đọc, chỉ ADMIN
      description: |
        Đọc audit_logs có sẵn; VIEWER bị từ chối. Mới nhất trước, sắp theo created_at
        và id giảm dần, tối đa 25 bản ghi/trang. Tìm kiếm literal trên tài khoản,
        tên/IP node, IP ghi nhận và target. Không trả raw JSON hoặc thông tin bí mật.
      security: [{BearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: action
          in: query
          schema:
            type: string
            enum: [LOGIN_SUCCESS, LOGIN_FAILED, LOGOUT_SUCCESS, BASTION_TICKET_ISSUED, BASTION_SESSION_START, BASTION_SESSION_END, CPU_HIGH, NODE_OFFLINE]
      responses:
        '200':
          description: Trang nhật ký, has_more cho biết còn trang tiếp
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogPage'}
        '400': {description: Bộ lọc không hợp lệ}
        '401': {description: Chưa xác thực hoặc phiên đã hết hiệu lực}
        '403': {description: Chỉ ADMIN được xem nhật ký}
        '503': {description: Không thể đọc DB hoặc xác thực phiên}
components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    NodeTokenAuth: {type: apiKey, in: header, name: X-Node-Token}
  schemas:
    AuditLogPage:
      type: object
      required: [success, data, page, page_size, has_more]
      properties:
        success: {type: boolean}
        page: {type: integer}
        page_size: {type: integer, enum: [25]}
        has_more: {type: boolean}
        data:
          type: array
          items: {$ref: '#/components/schemas/AuditLogItem'}
    AuditLogItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        action: {type: string}
        user_id: {type: string, format: uuid, nullable: true}
        username: {type: string, nullable: true}
        node_id: {type: string, format: uuid, nullable: true}
        node_name: {type: string, nullable: true}
        ip_address: {type: string, nullable: true}
        target: {type: string, nullable: true}
        details:
          type: object
          additionalProperties: false
          properties:
            attempted_username: {type: string, maxLength: 50}
            session_id: {type: string, maxLength: 96}
            reason: {type: string, maxLength: 160}
            target_ip: {type: string, maxLength: 64}
            message: {type: string, maxLength: 500}
            cpu_percent: {type: number, minimum: 0, maximum: 100}
            threshold: {type: number, minimum: 0, maximum: 100}
            ip: {type: string, maxLength: 64}
            last_seen: {type: string, format: date-time, nullable: true, maxLength: 64}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {type: string, enum: [ADMIN, VIEWER]}
        session_version: {type: integer}
    NodeItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        ip_address: {type: string, format: ipv4}
        node_type: {type: string, enum: [DOCKER, VM, BARE_METAL]}
        status: {type: string, enum: [HEALTHY, WARNING, OFFLINE]}
        last_seen: {type: string, format: date-time, nullable: true}
        latest_metric: {$ref: '#/components/schemas/MetricSnapshot'}
    MetricSnapshot:
      type: object
      properties:
        cpu_percent: {type: number}
        ram_percent: {type: number}
        disk_percent: {type: number}
        memory_used_bytes: {type: integer}
        memory_total_bytes: {type: integer}
        disk_used_bytes: {type: integer}
        disk_total_bytes: {type: integer}
        network_rx_bytes: {type: integer}
        network_tx_bytes: {type: integer}
        uptime_seconds: {type: integer}
        recorded_at: {type: string, format: date-time}
    ErrorResponse:
      type: object
      description: Trường mở rộng tùy lỗi; không hứa các mã/endpoint chưa hiện thực.
      required: [type, title, status, code, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
    TelemetryBeacon:
      type: object
      required: [node_id, timestamp, metrics]
      additionalProperties: false
      properties:
        node_id: { type: string }
        timestamp: { type: integer }
        metrics:
          type: object
          required: [cpu, memory, disk, network, uptime_seconds]
          properties:
            cpu:
              type: object
              required: [percent]
              properties:
                percent: { type: number, minimum: 0.0, maximum: 100.0 }
                load_avg:
                  type: array
                  items: { type: number }
            memory:
              type: object
              required: [total_bytes, used_bytes, percent]
              properties:
                total_bytes: { type: integer }
                used_bytes: { type: integer }
                percent: { type: number }
            disk:
              type: object
              required: [total_bytes, used_bytes, percent]
              properties:
                total_bytes: { type: integer }
                used_bytes: { type: integer }
                percent: { type: number }
            network:
              type: object
              required: [rx_bytes_total, tx_bytes_total]
              properties:
                rx_bytes_total: { type: integer }
                tx_bytes_total: { type: integer }
            uptime_seconds: { type: integer }
