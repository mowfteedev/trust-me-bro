openapi: 3.0.3
info:
  title: ZT-ServerOps Control Plane API
  version: 1.1.0
  description: |
    API của mô hình đồ án. Node được đăng ký bằng CLI setup-demo, không có HTTP CRUD node.
    ADMIN mở SSH; VIEWER chỉ đọc giám sát. Giá trị DB HEALTHY/WARNING/OFFLINE
    được giao diện hiển thị Online/Stale/Offline; cảnh báo CPU là incident riêng.
servers:
  - url: https://localhost
    description: Demo cục bộ, CA nội bộ Caddy
paths:
  /api/auth/login:
    post:
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: JWT HS256 và thông tin người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  token: {type: string}
                  user: {$ref: '#/components/schemas/User'}
        '401': {description: Sai thông tin đăng nhập}
        '403': {description: Tài khoản bị khóa}
        '429': {description: Vượt 10 lần đăng nhập mỗi phút trên một IP}
        '503': {description: Không lưu được audit}
  /api/auth/me:
    get:
      summary: Thông tin phiên, vai trò và session_version từ DB
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Người dùng hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  user: {$ref: '#/components/schemas/User'}
        '401': {description: JWT hết hạn hoặc đã bị thu hồi}
        '503': {description: Không xác thực được trạng thái DB}
  /api/auth/logout:
    post:
      summary: Thu hồi phiên JWT hiện tại; JWT cũ thiếu jti thu hồi mọi phiên
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Đã thu hồi phiên và ghi audit}
        '401': {description: Phiên không hợp lệ}
        '503': {description: Lỗi kết nối hoặc audit; client không nhận là xác nhận server}
  /api/nodes:
    get:
      summary: Danh sách node và bộ đo mới nhất
      description: Alias của GET /api/telemetry/nodes, cùng xác thực.
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Danh sách trong data (không phải array ở root)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/NodeItem'}
        '401': {description: Chưa xác thực}
  /api/telemetry/nodes:
    get:
      summary: Danh sách node, endpoint Dashboard đang dùng
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Object success/data như GET /api/nodes
        '401': {description: Chưa xác thực}
  /api/nodes/{node_id}/history:
    get:
      summary: Tối đa 100 bộ đo mới nhất, thứ tự thời gian giảm dần
      description: Alias của GET /api/telemetry/nodes/{node_id}/history.
      security: [{BearerAuth: []}]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Object success/node_id/count/data; node không có dữ liệu trả mảng rỗng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  node_id: {type: string}
                  count: {type: integer}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/MetricSnapshot'}
        '401': {description: Chưa xác thực}
  /api/telemetry/nodes/{node_id}/history:
    get:
      summary: Lịch sử node, endpoint Dashboard đang dùng
      security: [{BearerAuth: []}]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: 'Cùng object trả về như /api/nodes/{node_id}/history'}
        '401': {description: Chưa xác thực}
  /api/telemetry/beacon:
    post:
      summary: Nhận telemetry từ Mini-Agent qua WireGuard mỗi 3 giây
      description: |
        Alias POST /api/telemetry cũng được hỗ trợ. Token gắn đúng node_id.
        Nhận payload lồng metrics; định dạng phẳng được chuẩn hóa để tương thích.
        Schema dưới mô tả payload Agent. Dữ liệu liveness dùng giờ nhận trên Gateway.
      security: [{NodeTokenAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryBeacon'}
      responses:
        '200':
          description: Đã lưu metric và cập nhật heartbeat trong transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  node_id: {type: string}
                  status: {type: string, enum: [HEALTHY]}
                  recorded_at: {type: string, format: date-time}
        '400': {description: INVALID_TELEMETRY_PAYLOAD}
        '401': {description: MISSING_NODE_TOKEN / INVALID_NODE_TOKEN / REVOKED_NODE_TOKEN}
        '403': {description: IDOR_MISMATCH}
        '500': {description: Lỗi DB, transaction được rollback}
  /api/bastion/ticket:
    post:
      summary: Cấp vé SSH dùng một lần, chỉ ADMIN
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id: {type: string}
      responses:
        '200':
          description: Vé tối đa 30 giây và không vượt hạn JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  ticket: {type: string}
                  expires_in_seconds: {type: integer, maximum: 30}
        '401': {description: JWT không hợp lệ}
        '403': {description: VIEWER bị từ chối}
        '503': {description: Không ghi được audit}
  /ws/terminal/{node_id}:
    get:
      summary: WebSocket tới SSH/PTY
      description: |
        Không đặt JWT trong URL. Sau HTTP Upgrade, gửi frame JSON đầu tiên
        {"type":"AUTH","ticket":"vé từ /api/bastion/ticket"} trong 5 giây.
        Server trả READY hoặc ERROR; output UTF-8 được đóng gói thành
        {"type":"DATA","data":"nội dung terminal"}, tách khỏi frame điều khiển.
        Client gửi nội dung nhập dạng text; dữ liệu in ra giống JSON vẫn là DATA.
        READY có ssh_username là tài khoản SSH đã cấu hình của node để hiển thị
        user@node; client không được chọn tài khoản bằng AUTH hoặc vé.
        Resize gửi {"type":"RESIZE","rows":32,"cols":100}.
        Vé được tiêu thụ một lần. Gateway kiểm tra lại ADMIN/session_version,
        khóa SSH và fingerprint; logout/khóa tài khoản thu hồi phiên đang mở.
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '101': {description: Upgrade; xác thực ứng dụng tiếp tục bằng AUTH frame}
  /api/audit/logs/purge-preview:
    get:
      summary: Xem trước số lượng bản ghi nhật ký dự kiến dọn dẹp, chỉ ADMIN
      description: |
        Tính toán số lượng bản ghi cũ hơn mốc thời gian chỉ định (1d, 7d, 30d) và số bản ghi giữ lại.
        Chỉ đọc dữ liệu, không thực hiện xóa. Chỉ ADMIN có quyền xem.
      security: [{BearerAuth: []}]
      parameters:
        - name: retention
          in: query
          schema: {type: string, enum: ['1d', '7d', '30d'], default: '7d'}
      responses:
        '200':
          description: Dữ liệu xem trước dọn dẹp
          content:
            application/json:
              schema:
                type: object
                required: [success, retention, retention_label, cutoff_time, records_to_delete, records_to_keep, total_records, can_purge]
                properties:
                  success: {type: boolean}
                  retention: {type: string, enum: ['1d', '7d', '30d']}
                  retention_label: {type: string}
                  cutoff_time: {type: string}
                  records_to_delete: {type: integer}
                  records_to_keep: {type: integer}
                  total_records: {type: integer}
                  can_purge: {type: boolean}
        '400': {description: Mốc thời gian retention không hợp lệ}
        '401': {description: Chưa xác thực}
        '403': {description: Chỉ ADMIN được xem trước dọn nhật ký}
        '503': {description: Lỗi DB hoặc dịch vụ không khả dụng}
  /api/audit/logs:
    get:
      summary: Nhật ký hoạt động chỉ đọc, chỉ ADMIN
      description: |
        Đọc audit_logs có sẵn; VIEWER bị từ chối. Mới nhất trước, sắp theo created_at
        và id giảm dần, tối đa 25 bản ghi/trang. Tìm kiếm literal trên tài khoản,
        tên/IP node, IP ghi nhận và target. Không trả raw JSON hoặc thông tin bí mật.
      security: [{BearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: action
          in: query
          schema:
            type: string
            enum: [LOGIN_SUCCESS, LOGIN_FAILED, LOGOUT_SUCCESS, BASTION_TICKET_ISSUED, BASTION_SESSION_START, BASTION_SESSION_END, CPU_HIGH, NODE_OFFLINE, TELEGRAM_TEST, AUDIT_PURGED, CPU_RECOVERED, USER_CREATED, USER_UPDATED, USER_PASSWORD_RESET, PASSWORD_CHANGED]
      responses:
        '200':
          description: Trang nhật ký, has_more cho biết còn trang tiếp
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogPage'}
        '400': {description: Bộ lọc không hợp lệ}
        '401': {description: Chưa xác thực hoặc phiên đã hết hiệu lực}
        '403': {description: Chỉ ADMIN được xem nhật ký}
        '503': {description: Không thể đọc DB hoặc xác thực phiên}
    delete:
      summary: Dọn dẹp nhật ký hoạt động cũ, chỉ ADMIN
      description: |
        Xóa các bản ghi audit_logs cũ hơn mốc thời gian chỉ định (1d, 7d, 30d).
        Chỉ ADMIN có quyền thực thi. Ghi lại sự kiện AUDIT_PURGED sau khi dọn dẹp.
      security: [{BearerAuth: []}]
      parameters:
        - name: retention
          in: query
          required: true
          schema: {type: string, enum: ['1d', '7d', '30d']}
      responses:
        '200':
          description: Đã xóa thành công và trả về số lượng bản ghi đã xóa
          content:
            application/json:
              schema:
                type: object
                required: [success, deleted_count, retention, message]
                properties:
                  success: {type: boolean}
                  deleted_count: {type: integer}
                  retention: {type: string, enum: ['1d', '7d', '30d']}
                  message: {type: string}
        '400': {description: Mốc thời gian retention không hợp lệ}
        '401': {description: Chưa xác thực}
        '403': {description: Chỉ ADMIN được xóa nhật ký}
        '503': {description: Lỗi DB hoặc dịch vụ không khả dụng}
  /api/auth/logout-all:
    post:
      summary: Thu hồi toàn bộ phiên đăng nhập và Web SSH của tài khoản
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Đã tăng session_version và thu hồi phiên}
        '401': {description: Phiên không hợp lệ}
        '503': {description: Không thể xác nhận thu hồi}
  /api/auth/change-password:
    post:
      summary: Đổi mật khẩu và thu hồi mọi phiên của chính mình
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
                new_password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
      responses:
        '200': {description: Đã đổi mật khẩu; cần đăng nhập lại}
        '400': {description: Sai mật khẩu hiện tại hoặc dữ liệu không hợp lệ}
        '401': {description: Chưa đăng nhập}
        '503': {description: Không cập nhật được tài khoản}
  /api/users:
    get:
      summary: Admin xem danh sách tài khoản; không trả password hash
      security: [{BearerAuth: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
      responses:
        '200':
          description: Danh sách phân trang 25 tài khoản
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  page: {type: integer}
                  page_size: {type: integer, enum: [25]}
                  has_more: {type: boolean}
                  data: {type: array, items: {$ref: '#/components/schemas/ManagedUser'}}
        '403': {description: Chỉ Admin được phép}
    post:
      summary: Admin tạo tài khoản và ghi audit trong cùng transaction
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, role]
              properties:
                username: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,49}$'}
                password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
                role: {type: string, enum: [ADMIN, VIEWER]}
      responses:
        '201': {description: Tài khoản đã tạo}
        '400': {description: Dữ liệu không hợp lệ}
        '403': {description: Chỉ Admin được phép}
        '409': {description: Tên đăng nhập đã tồn tại}
  /api/users/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: Đổi quyền hoặc khóa tài khoản; giữ Admin cuối cùng và chống tự khóa
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                role: {type: string, enum: [ADMIN, VIEWER]}
                is_active: {type: boolean}
      responses:
        '200': {description: Đã cập nhật; phiên cũ bị thu hồi nếu quyền thay đổi}
        '403': {description: Chỉ Admin được phép}
        '404': {description: Tài khoản không tồn tại}
        '409': {description: Tự khóa hoặc mất Admin cuối cùng}
  /api/users/{id}/reset-password:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Admin đặt lại mật khẩu và thu hồi mọi phiên của tài khoản đích
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
      responses:
        '200': {description: Đã đặt lại mật khẩu}
        '403': {description: Chỉ Admin được phép}
        '404': {description: Tài khoản không tồn tại}
  /api/telegram/pairing:
    get:
      summary: Admin chủ động đọc trạng thái hoặc OTP ghép bot; no-store
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: OTP chỉ có khi live và chưa ghép kênh; không trả token/chat ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: {type: string, enum: [disabled, dry-run, live]}
                  paired: {type: boolean}
                  otp: {type: string, nullable: true}
        '403': {description: Chỉ Admin được phép}
  /api/telegram/test:
    post:
      summary: Admin và Viewer gửi tin thử tới kênh đã ghép; không tạo sự cố
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Gửi thành công hoặc giả lập có nhãn dryRun}
        '400': {description: Chưa cấu hình hoặc gửi thất bại}
        '401': {description: Chưa đăng nhập}
        '409': {description: Đang có yêu cầu gửi thử}
        '429': {description: Chưa hết khoảng chờ 15 giây}
  /api/incidents:
    get:
      summary: Admin và Viewer xem sự cố cùng kết quả gửi Telegram
      security: [{BearerAuth: []}]
      parameters:
        - {in: query, name: state, schema: {type: string, enum: [open, resolved, all], default: open}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: node_id, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Sự cố và phân trang; dữ liệu gửi cũ chưa có bằng chứng trả null
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {type: array, items: {$ref: '#/components/schemas/Incident'}}
                  pagination:
                    type: object
                    properties:
                      page: {type: integer}
                      page_size: {type: integer}
                      total: {type: integer}
                      total_pages: {type: integer}
        '400': {description: Bộ lọc không hợp lệ}
        '401': {description: Chưa đăng nhập}
        '503': {description: Không đọc được dữ liệu sự cố}
components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    NodeTokenAuth: {type: apiKey, in: header, name: X-Node-Token}
  schemas:
    ManagedUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          properties:
            is_active: {type: boolean}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    DeliveryStatus:
      type: object
      nullable: true
      properties:
        status: {type: string, enum: [PENDING, PROCESSING, SENT, FAILED, DRY_RUN, DISABLED]}
        attempts: {type: integer, minimum: 0, maximum: 3}
        last_attempt_at: {type: string, format: date-time, nullable: true}
        last_error: {type: string, nullable: true}
    Incident:
      type: object
      properties:
        id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        node_name: {type: string}
        ip_address: {type: string}
        type: {type: string, enum: [NODE_OFFLINE, CPU_HIGH, OTHER]}
        severity: {type: string}
        message: {type: string}
        created_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, nullable: true}
        duration_seconds: {type: integer, minimum: 0}
        opening_delivery: {$ref: '#/components/schemas/DeliveryStatus'}
        recovery_delivery: {$ref: '#/components/schemas/DeliveryStatus'}
    AuditLogPage:
      type: object
      required: [success, data, page, page_size, has_more]
      properties:
        success: {type: boolean}
        page: {type: integer}
        page_size: {type: integer, enum: [25]}
        has_more: {type: boolean}
        data:
          type: array
          items: {$ref: '#/components/schemas/AuditLogItem'}
    AuditLogItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        action: {type: string}
        user_id: {type: string, format: uuid, nullable: true}
        username: {type: string, nullable: true}
        node_id: {type: string, format: uuid, nullable: true}
        node_name: {type: string, nullable: true}
        ip_address: {type: string, nullable: true}
        target: {type: string, nullable: true}
        details:
          type: object
          additionalProperties: false
          properties:
            attempted_username: {type: string, maxLength: 50}
            username: {type: string, maxLength: 50}
            is_active: {type: boolean}
            scope: {type: string, enum: [current, all]}
            session_id: {type: string, maxLength: 96}
            reason: {type: string, maxLength: 160}
            target_ip: {type: string, maxLength: 64}
            message: {type: string, maxLength: 500}
            cpu_percent: {type: number, minimum: 0, maximum: 100}
            threshold: {type: number, minimum: 0, maximum: 100}
            ip: {type: string, maxLength: 64}
            last_seen: {type: string, format: date-time, nullable: true, maxLength: 64}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {type: string, enum: [ADMIN, VIEWER]}
        session_version: {type: integer}
    NodeItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        ip_address: {type: string, format: ipv4}
        node_type: {type: string, enum: [DOCKER, VM, BARE_METAL]}
        status: {type: string, enum: [HEALTHY, WARNING, OFFLINE]}
        last_seen: {type: string, format: date-time, nullable: true}
        latest_metric: {$ref: '#/components/schemas/MetricSnapshot'}
    MetricSnapshot:
      type: object
      properties:
        cpu_percent: {type: number}
        ram_percent: {type: number}
        disk_percent: {type: number}
        memory_used_bytes: {type: integer}
        memory_total_bytes: {type: integer}
        disk_used_bytes: {type: integer}
        disk_total_bytes: {type: integer}
        network_rx_bytes: {type: integer}
        network_tx_bytes: {type: integer}
        uptime_seconds: {type: integer}
        recorded_at: {type: string, format: date-time}
    ErrorResponse:
      type: object
      description: Trường mở rộng tùy lỗi; không hứa các mã/endpoint chưa hiện thực.
      required: [type, title, status, code, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
    TelemetryBeacon:
      type: object
      required: [node_id, timestamp, metrics]
      additionalProperties: false
      properties:
        node_id: { type: string }
        timestamp: { type: integer }
        metrics:
          type: object
          required: [cpu, memory, disk, network, uptime_seconds]
          properties:
            cpu:
              type: object
              required: [percent]
              properties:
                percent: { type: number, minimum: 0.0, maximum: 100.0 }
                load_avg:
                  type: array
                  items: { type: number }
            memory:
              type: object
              required: [total_bytes, used_bytes, percent]
              properties:
                total_bytes: { type: integer }
                used_bytes: { type: integer }
                percent: { type: number }
            disk:
              type: object
              required: [total_bytes, used_bytes, percent]
              properties:
                total_bytes: { type: integer }
                used_bytes: { type: integer }
                percent: { type: number }
            network:
              type: object
              required: [rx_bytes_total, tx_bytes_total]
              properties:
                rx_bytes_total: { type: integer }
                tx_bytes_total: { type: integer }
            uptime_seconds: { type: integer }
