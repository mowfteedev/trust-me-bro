# API and one-shot DB jobs reuse the same runtime image.
x-gateway-image: &gateway-image
  image: ${ZT_GATEWAY_IMAGE:-zt-serverops-gateway:local}
  build:
    context: ./gateway
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-32MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-30}
      - -c
      - work_mem=${PG_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-16MB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zt_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Chạy deploy/scripts/init-secrets.sh trước}"
      POSTGRES_DB: ${POSTGRES_DB:-zt_serverops}
    volumes:
      - zt_postgres_data:/var/lib/postgresql/data
    networks:
      - zt_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zt_admin} -d $${POSTGRES_DB:-zt_serverops}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # DDL runs with admin credentials only until migration completes.
  migrator:
    <<: *gateway-image
    restart: "no"
    environment:
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?LỖI: MIGRATION_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      NODE_ENV: ${NODE_ENV:-production}
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zt_internal_net

  provisioner:
    <<: *gateway-image
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: "${MIGRATION_DATABASE_URL:?LỖI: MIGRATION_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      DATABASE_URL: "${DATABASE_URL:?LỖI: DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      MAINTENANCE_DATABASE_URL: "${MAINTENANCE_DATABASE_URL:?LỖI: MAINTENANCE_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      NODE_ENV: ${NODE_ENV:-production}
    command: ["node", "dist/scripts/provision-roles.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - zt_internal_net

  # Opt-in retention job uses its own least-privilege DB role.
  maintenance:
    <<: *gateway-image
    profiles: ["maintenance"]
    restart: "no"
    environment:
      MAINTENANCE_DATABASE_URL: "${MAINTENANCE_DATABASE_URL:?LỖI: MAINTENANCE_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      RETENTION_DAYS: 7
    command: ["node", "dist/scripts/run-maintenance.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      provisioner:
        condition: service_completed_successfully
    networks:
      - zt_internal_net

  gateway:
    <<: *gateway-image
    restart: unless-stopped
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: "${JWT_SECRET:?LỖI: JWT_SECRET bắt buộc phải được thiết lập trong .env}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # Only this Caddy peer may supply forwarded client addresses.
      TRUSTED_PROXY_IP: ${PROXY_INTERNAL_IP:-172.30.88.254}
      DATABASE_URL: "${DATABASE_URL:?LỖI: DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      BASTION_SSH_KEY_PATH: ${BASTION_SSH_KEY_PATH:-./keys/bastion_id_ed25519}
      BASTION_DEFAULT_USER: ${BASTION_DEFAULT_USER:-ztuser}
      BASTION_CONNECT_TIMEOUT_MS: ${BASTION_CONNECT_TIMEOUT_MS:-10000}
      SWEEPER_INTERVAL_MS: ${SWEEPER_INTERVAL_MS:-5000}
      NODE_OFFLINE_THRESHOLD_SECONDS: ${NODE_OFFLINE_THRESHOLD_SECONDS:-30}
      NODE_STALE_THRESHOLD_SECONDS: ${NODE_STALE_THRESHOLD_SECONDS:-15}
      CPU_ALERT_THRESHOLD_PERCENT: ${CPU_ALERT_THRESHOLD_PERCENT:-85}
      CPU_RECOVERY_THRESHOLD_PERCENT: ${CPU_RECOVERY_THRESHOLD_PERCENT:-75}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-dry-run}
      TELEGRAM_REQUEST_TIMEOUT_MS: ${TELEGRAM_REQUEST_TIMEOUT_MS:-5000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PAIR_OTP: ${TELEGRAM_PAIR_OTP:-}
      WG_GATEWAY_IP: ${WG_GATEWAY_IP:-10.100.0.1}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      provisioner:
        condition: service_completed_successfully
    volumes:
      - ./keys/bastion_id_ed25519:/app/keys/bastion_id_ed25519:ro
      - zt_audit_logs:/app/logs/audit
    networks:
      - zt_ingress_net
      - zt_internal_net
      - zt_wg_transport
    ports:
      - "${WG_BIND_IP:-0.0.0.0}:${WG_HOST_PORT:-51820}:51820/udp"
    expose:
      - "3000"

  # One Caddy serves React files and proxies API/WebSocket traffic.
  proxy:
    image: ${ZT_PROXY_IMAGE:-zt-serverops-proxy:local}
    build:
      context: .
      dockerfile: deploy/proxy/Dockerfile
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      zt_ingress_net:
        ipv4_address: ${PROXY_INTERNAL_IP:-172.30.88.254}

  wireguard_gateway:
    image: ${ZT_WIREGUARD_IMAGE:-zt-serverops-wireguard:local}
    build: ./deploy/wireguard
    restart: unless-stopped
    # Only this helper may change the Gateway namespace network/firewall.
    network_mode: service:gateway
    cap_add: [NET_ADMIN]
    environment:
      WG_ROLE: gateway
    volumes:
      - ./keys/wg0-gateway.conf:/etc/wireguard/wg0.conf:ro
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Optional local demo Worker; no published ports or DB access.
  node_worker_01:
    profiles: [demo]
    build:
      context: .
      dockerfile: deploy/demo/worker.Dockerfile
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      NODE_ID: ${NODE_ID_01:-node-worker-01}
      NODE_TOKEN: "${NODE_TOKEN_01:-}"
      GATEWAY_URL: http://10.100.0.1:3000
      BEACON_INTERVAL_SECONDS: "3.0"
      JITTER_RATIO: "0.0"
      NETWORK_INTERFACE: wg0
      DISK_MOUNT_POINT: /
    volumes:
      - ./keys/wg0-node.conf:/etc/wireguard/wg0.conf:ro
      - ./keys/bastion_id_ed25519.pub:/run/zt/authorized_keys:ro
      - ./keys/worker_ssh_host_ed25519:/run/zt/ssh_host_ed25519_key:ro
    depends_on:
      wireguard_gateway:
        condition: service_healthy
    networks:
      - zt_wg_transport

networks:
  zt_wg_transport:
    driver: bridge
  zt_ingress_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:-172.30.88.0/24}

  # Database network has no external route.
  zt_internal_net:
    driver: bridge
    internal: true

volumes:
  zt_postgres_data:
  zt_audit_logs:
  caddy_data:
  caddy_config:
