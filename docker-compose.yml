# ==============================================================================
# HỆ THỐNG ĐIỀU PHỐI TOÀN BỘ CỤM CONTAINER ZT-SERVEROPS (docker-compose.yml)
# Dự án: ZT-ServerOps (do-an-co-so-nganh)
# Phụ trách: devops (chủ trì), security, tech-lead
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU POSTGRESQL v3.1 (TÍCH HỢP RANGE PARTITIONING)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zt_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Chạy deploy/scripts/init-secrets.sh trước}"
      POSTGRES_DB: ${POSTGRES_DB:-zt_serverops}
    volumes:
      - zt_postgres_data:/var/lib/postgresql/data
    networks:
      - zt_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zt_admin} -d $${POSTGRES_DB:-zt_serverops}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 1.5. TIẾN TRÌNH THỰC THI SCHEMA MIGRATIONS ĐỘC LẬP (ZT_MIGRATOR)
  # ----------------------------------------------------------------------------
  # LÝ DO PHI TRỰC GIÁC (RATIONALE - N01 & N02 REMEDIATION):
  # Tách biệt hoàn toàn quyền sở hữu schema DDL:
  # - zt_migrator là nơi duy nhất giữ thông tin xác thực zt_admin để chạy DDL.
  # - Sau khi áp dụng xong các bản migration (001 -> 006), container tự thoát (exit 0).
  # - zt_gateway chỉ khởi động sau khi zt_migrator hoàn tất thành công.
  # ----------------------------------------------------------------------------
  migrator:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?LỖI: MIGRATION_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      NODE_ENV: ${NODE_ENV:-production}
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zt_internal_net

  # ----------------------------------------------------------------------------
  # 1.6. DỊCH VỤ CẤP PHÁT MẬT KHẨU VAI TRÒ CSDL THỰC TẾ (ZT_PROVISIONER - R3-01)
  # Phân quyền: Sử dụng quyền admin zt_admin để gán mật khẩu ngẫu nhiên cho zt_app
  # ----------------------------------------------------------------------------
  provisioner:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: "${MIGRATION_DATABASE_URL:?LỖI: MIGRATION_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      DATABASE_URL: "${DATABASE_URL:?LỖI: DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      MAINTENANCE_DATABASE_URL: "${MAINTENANCE_DATABASE_URL:?LỖI: MAINTENANCE_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      NODE_ENV: ${NODE_ENV:-production}
    command: ["node", "dist/scripts/provision-roles.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - zt_internal_net

  # ----------------------------------------------------------------------------
  # 1.7. DỊCH VỤ BẢO TRÌ PHÂN VÙNG DỮ LIỆU ĐỊNH KỲ (ZT_MAINTENANCE)
  # Phân quyền: Sử dụng vai trò chuyên trách zt_maintenance (N03 & R3-05 Remediation)
  # ----------------------------------------------------------------------------
  maintenance:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    profiles: ["maintenance"]
    restart: "no"
    environment:
      MAINTENANCE_DATABASE_URL: "${MAINTENANCE_DATABASE_URL:?LỖI: MAINTENANCE_DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      RETENTION_DAYS: 7
    command: ["node", "dist/scripts/run-maintenance.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      provisioner:
        condition: service_completed_successfully
    networks:
      - zt_internal_net

  # ----------------------------------------------------------------------------
  # 2. TRẠM ĐIỀU HÀNH TRUNG TÂM (CONTROL PLANE GATEWAY)
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Cấu hình mạng dịch vụ Fastify
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # Danh tính và Xác thực
      JWT_SECRET: "${JWT_SECRET:?LỖI: JWT_SECRET bắt buộc phải được thiết lập trong .env}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # Kết nối CSDL: CHỈ SỬ DỤNG VAI TRÒ ÍT QUYỀN zt_app (N02 & R3-01 REMEDIATION)
      DATABASE_URL: "${DATABASE_URL:?LỖI: DATABASE_URL bắt buộc phải được thiết lập trong .env}"
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      # Web SSH Bastion
      BASTION_SSH_KEY_PATH: ${BASTION_SSH_KEY_PATH:-./keys/bastion_id_ed25519}
      BASTION_DEFAULT_USER: ${BASTION_DEFAULT_USER:-ztuser}
      BASTION_CONNECT_TIMEOUT_MS: ${BASTION_CONNECT_TIMEOUT_MS:-10000}
      # Giám sát Liveness Sweeper
      SWEEPER_INTERVAL_MS: ${SWEEPER_INTERVAL_MS:-5000}
      NODE_OFFLINE_THRESHOLD_SECONDS: ${NODE_OFFLINE_THRESHOLD_SECONDS:-30}
      NODE_STALE_THRESHOLD_SECONDS: ${NODE_STALE_THRESHOLD_SECONDS:-15}
      CPU_ALERT_THRESHOLD_PERCENT: ${CPU_ALERT_THRESHOLD_PERCENT:-85}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-dry-run}
      TELEGRAM_REQUEST_TIMEOUT_MS: ${TELEGRAM_REQUEST_TIMEOUT_MS:-5000}
      # Telegram Bot & WireGuard
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PAIR_OTP: ${TELEGRAM_PAIR_OTP:-}
      WG_GATEWAY_IP: ${WG_GATEWAY_IP:-10.100.0.1}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      provisioner:
        condition: service_completed_successfully
    volumes:
      - ./keys/bastion_id_ed25519:/app/keys/bastion_id_ed25519:ro
      - zt_audit_logs:/app/logs/audit
    networks:
      - zt_ingress_net
      - zt_internal_net
      - zt_wg_transport
    ports:
      - "${WG_BIND_IP:-0.0.0.0}:51820:51820/udp"
    expose:
      - "3000"

  # ----------------------------------------------------------------------------
  # 3. BẢNG ĐIỀU KHIỂN GIAO DIỆN WEB CONSOLE (REACT 19 SPA)
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - zt_ingress_net
    expose:
      - "80"

  # ----------------------------------------------------------------------------
  # 4. CỔNG BIÊN REVERSE PROXY & TỰ ĐỘNG HÓA TLS (CADDY)
  # ----------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - dashboard
    networks:
      - zt_ingress_net

  # ----------------------------------------------------------------------------
  # 5. MÁY CHỦ CON MÔ PHỎNG PHÁT SÓNG THỰC TẾ (WORKER DAEMON AGENT)
  # ----------------------------------------------------------------------------
  wireguard_gateway:
    build: ./deploy/wireguard
    restart: unless-stopped
    # Only this helper changes interfaces/firewall inside the Gateway namespace.
    network_mode: service:gateway
    cap_add: [NET_ADMIN]
    environment:
      WG_ROLE: gateway
    volumes:
      - ./keys/wg0-gateway.conf:/etc/wireguard/wg0.conf:ro
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 3s
      timeout: 2s
      retries: 10

  node_worker_01:
    profiles: [demo]
    build:
      context: .
      dockerfile: deploy/demo/worker.Dockerfile
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      NODE_ID: ${NODE_ID_01:-node-worker-01}
      NODE_TOKEN: "${NODE_TOKEN_01:-}"
      GATEWAY_URL: http://10.100.0.1:3000
      BEACON_INTERVAL_SECONDS: "3.0"
      JITTER_RATIO: "0.0"
    volumes:
      - ./keys/wg0-node.conf:/etc/wireguard/wg0.conf:ro
      - ./keys/bastion_id_ed25519.pub:/run/zt/authorized_keys:ro
      - ./keys/worker_ssh_host_ed25519:/run/zt/ssh_host_ed25519_key:ro
    depends_on:
      wireguard_gateway:
        condition: service_healthy
    # No published port and no direct access to ingress or database networks.
    networks:
      - zt_wg_transport

# ------------------------------------------------------------------------------
# 6. MẠNG NỘI BỘ VÀ KHỐI LƯU TRỮ VĨNH CỬU (NETWORKS & VOLUMES)
# ------------------------------------------------------------------------------
networks:
  zt_wg_transport:
    driver: bridge
  # Mạng biên tiếp nhận lưu lượng từ Caddy chuyển tiếp vào Gateway & Dashboard
  zt_ingress_net:
    driver: bridge

  # Mạng nội bộ tuyệt mật nối Gateway với CSDL PostgreSQL (Cấm truy cập Internet)
  zt_internal_net:
    driver: bridge
    internal: true

volumes:
  zt_postgres_data:
  zt_audit_logs:
  caddy_data:
  caddy_config:
