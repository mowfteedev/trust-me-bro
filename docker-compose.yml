# ==============================================================================
# HỆ THỐNG ĐIỀU PHỐI TOÀN BỘ CỤM CONTAINER ZT-SERVEROPS (docker-compose.yml)
# Dự án: ZT-ServerOps (do-an-co-so-nganh)
# Phụ trách: devops (chủ trì), security, tech-lead
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU POSTGRESQL v3.1 (TÍCH HỢP RANGE PARTITIONING)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: zt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-zt_serverops}
    volumes:
      - zt_postgres_data:/var/lib/postgresql/data
      - ./gateway/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - zt_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zt_admin} -d $${POSTGRES_DB:-zt_serverops}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. TRẠM ĐIỀU HÀNH TRUNG TÂM (CONTROL PLANE GATEWAY)
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: zt_gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys:ro
      - zt_audit_logs:/app/logs/audit
    networks:
      - zt_ingress_net
      - zt_internal_net
    expose:
      - "3000"

  # ----------------------------------------------------------------------------
  # 3. BẢNG ĐIỀU KHIỂN GIAO DIỆN WEB CONSOLE (REACT 19 SPA)
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: zt_dashboard
    restart: unless-stopped
    networks:
      - zt_ingress_net
    expose:
      - "80"

  # ----------------------------------------------------------------------------
  # 4. CỔNG BIÊN REVERSE PROXY & TỰ ĐỘNG HÓA TLS (CADDY)
  # ----------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: zt_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - dashboard
    networks:
      - zt_ingress_net

  # ----------------------------------------------------------------------------
  # 5. MÁY CHỦ CON MÔ PHỎNG PHÁT SÓNG THỰC TẾ (WORKER DAEMON AGENT)
  # ----------------------------------------------------------------------------
  node_worker_01:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: zt_worker_node_01
    restart: unless-stopped
    environment:
      NODE_ID: node-worker-01
      NODE_TOKEN: ${NODE_TOKEN_01:-secret-token-worker-01}
      GATEWAY_URL: http://gateway:3000
      BEACON_INTERVAL_SECONDS: "3.0"
      JITTER_RATIO: "0.1"
    depends_on:
      - gateway
    networks:
      - zt_ingress_net

# ------------------------------------------------------------------------------
# 6. MẠNG NỘI BỘ VÀ KHỐI LƯU TRỮ VĨNH CỬU (NETWORKS & VOLUMES)
# ------------------------------------------------------------------------------
networks:
  # Mạng biên tiếp nhận lưu lượng từ Caddy chuyển tiếp vào Gateway & Dashboard
  zt_ingress_net:
    name: zt_ingress_net
    driver: bridge

  # Mạng nội bộ tuyệt mật nối Gateway với CSDL PostgreSQL (Cấm truy cập Internet)
  zt_internal_net:
    name: zt_internal_net
    driver: bridge
    internal: true

volumes:
  zt_postgres_data:
    name: zt_postgres_data
  zt_audit_logs:
    name: zt_audit_logs
  caddy_data:
    name: zt_caddy_data
  caddy_config:
    name: zt_caddy_config
