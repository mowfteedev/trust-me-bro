#!/usr/sbin/nft -f
# Dedicated Worker; inspect existing rules before applying this table.
table inet zt_worker {
 chain input {
  type filter hook input priority 0; policy drop;
  iifname "lo" accept
  ct state established,related accept
  ct state invalid drop
  iifname "wg0" ip saddr 10.100.0.1 tcp dport 22 accept
  iifname "enp1s0" udp sport 67 udp dport 68 accept
  ip6 saddr fe80::/10 ip6 hoplimit 255 icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
 }
 chain forward {
  type filter hook forward priority 0; policy drop;
 }
 chain output {
  type filter hook output priority 0; policy accept;
 }
}
