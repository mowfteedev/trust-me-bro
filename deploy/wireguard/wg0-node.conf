# ==============================================================================
# CẤU HÌNH GIAO DIỆN MẠNG NGẦM WIREGUARD TẠI WORKER NODE (wg0-node.conf)
# Dự án: ZT-ServerOps (do-an-co-so-nganh)
# Phụ trách: devops (chủ trì), security
# ==============================================================================

[Interface]
# Địa chỉ IP của máy con trong mạng ngầm
Address = 10.100.0.2/24
# Khóa bí mật Curve25519 của máy con (sinh tự động qua agent/install.sh)
PrivateKey = NODE_PRIVATE_KEY_PLACEHOLDER

# ------------------------------------------------------------------------------
# TRẠM ĐIỀU PHỐI TRUNG TÂM (GATEWAY CONTROL PLANE)
# ------------------------------------------------------------------------------
[Peer]
# Khóa công khai của Gateway
PublicKey = GATEWAY_PUBLIC_KEY_PLACEHOLDER
# Địa chỉ IP công cộng hoặc tên miền của Gateway kèm cổng UDP 51820
# CHÚ THÍCH THIẾT LẬP: Cập nhật địa chỉ IP thật của máy chủ Gateway tại đây
Endpoint = gateway.example.com:51820
# Chỉ định tuyến lưu lượng dành cho mạng ngầm Gateway
AllowedIPs = 10.100.0.1/32
# Gửi gói tin duy trì kết nối NAT xuyên tường lửa mỗi 25 giây
PersistentKeepalive = 25
