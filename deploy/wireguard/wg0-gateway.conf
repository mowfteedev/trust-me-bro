# ==============================================================================
# CẤU HÌNH GIAO DIỆN MẠNG NGẦM WIREGUARD TẠI CONTROL PLANE (wg0-gateway.conf)
# Dự án: ZT-ServerOps (do-an-co-so-nganh)
# Phụ trách: devops (chủ trì), security
# ==============================================================================

[Interface]
# Địa chỉ IP của Gateway trong mạng ngầm
Address = 10.100.0.1/24
# Cổng mở ngoài DUY NHẤT của toàn hệ thống ra Internet (UDP 51820)
ListenPort = 51820
# Khóa bí mật Curve25519 của Gateway (Nạp từ keys/wireguard_gateway_private.key)
PrivateKey = GATEWAY_PRIVATE_KEY_PLACEHOLDER

# Tự động cấu hình chuyển tiếp gói tin nội bộ qua iptables
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# ------------------------------------------------------------------------------
# PEER 01: ENDPOINT WORKER NODE 01 (MÁY CHỦ CON 01)
# ------------------------------------------------------------------------------
[Peer]
# Khóa công khai của Worker Node 01
PublicKey = NODE_01_PUBLIC_KEY_PLACEHOLDER
# Địa chỉ IP cố định cấp phát cho Worker Node 01 trong mạng ngầm
AllowedIPs = 10.100.0.2/32
